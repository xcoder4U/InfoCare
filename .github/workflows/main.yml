name: Build InfoCare APK and AAB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project root and verify files
        id: proj
        run: |
          echo "--- Repository files ---"
          find . -path ./.git -prune -o -type f -print | head -80
          ROOT=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          if [ -z "$ROOT" ] || [ "$ROOT" = "." -a ! -f settings.gradle ]; then
            echo "::error::settings.gradle repository me nahi mili. Project ki saari files upload karein."; exit 1
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          cd "$ROOT"
          MISSING=0
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/infocare/studio/MainActivity.kt app/src/main/assets/index.html; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::Upar MISSING likhi files upload nahi hui hain. 'app' folder aur uski saari files upload karein."; exit 1
          fi
          gradle --no-daemon projects

      - name: Build APK and AAB
        working-directory: ${{ steps.proj.outputs.root }}
        run: gradle --no-daemon assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: InfoCare-APK-and-AAB
          path: |
            ${{ steps.proj.outputs.root }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.proj.outputs.root }}/app/build/outputs/bundle/release/*.aab
            
